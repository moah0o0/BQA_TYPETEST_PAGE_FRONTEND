<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>해설지 출력 · 운영</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <style>body{margin:0;background:#f5f5f7}</style>
</head>
<body>
  <header class="bar">
    <strong>퀴어 활동 캐해 · 해설지 출력</strong>
    <span class="bar-right"><a href="label.html" class="bar-link">🏷 라벨 출력 (Niimbot)</a><span id="conn" class="pill">연결 안 됨</span></span>
  </header>

  <main class="wrap">
    <section class="col controls">
      <details id="settings">
        <summary>연결 설정</summary>
        <label>API 주소 <input id="api" placeholder="https://typetest-api.example.kr"></label>
        <label>관리자 토큰 <input id="token" type="password" autocomplete="off"></label>
        <button id="save">저장하고 연결</button>
        <p class="muted">토큰은 이 컴퓨터의 브라우저에만 저장돼요.</p>
      </details>

      <form id="lookup" class="lookup">
        <label for="num">결과 번호</label>
        <div class="row"><input id="num" inputmode="numeric" pattern="[0-9]*" placeholder="예) 42" autocomplete="off"><button>불러오기</button></div>
      </form>

      <div class="opts">
        <label>용지 <select id="paper"><option value="58">58mm</option><option value="80">80mm</option></select></label>
        <label><input type="checkbox" id="withChar" checked> 캐릭터 포함</label>
        <label><input type="checkbox" id="withMsg" checked> 한마디 포함</label>
      </div>

      <div class="actions">
        <button id="print" class="primary" disabled>인쇄 (Ctrl+P)</button>
        <button id="png" disabled>PNG 저장</button>
        <button id="txt" disabled>텍스트 저장</button>
        <button id="done" disabled>출력 완료 표시</button>
      </div>

      <h2>최근 참여자 <small class="muted">10초마다 갱신</small></h2>
      <input id="q" placeholder="닉네임·한마디·번호 검색">
      <table class="list">
        <thead><tr><th>No.</th><th>닉네임</th><th>유형</th><th>출력</th><th>행진</th></tr></thead>
        <tbody id="rows"><tr><td colspan="5" class="muted">연결 설정을 먼저 해 주세요.</td></tr></tbody>
      </table>
    </section>

    <section class="col preview">
      <div id="receipt" class="receipt w58"><p class="placeholder">번호를 불러오면 해설지 미리보기가 여기에 나와요.</p></div>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script>
  /*
   * 캐시 우회 로더
   * 클라우드플레어가 JS/CSS를 브라우저에 4시간 캐시하기 때문에,
   * script/link 태그 대신 매번 서버에 "바뀌었나?"를 확인(대부분 304, 몇 바이트)하고 받아 실행합니다.
   * → 업데이트를 올리면 다음 접속부터 바로 반영 (강력 새로고침 불필요)
   * 새 JS/CSS 파일을 추가하면 아래 목록에도 넣어 주세요.
   */
  (function (css, js) {
    function get(u) {
      return fetch(u, { cache: "no-cache" }).then(function (r) {
        if (!r.ok) throw new Error(u + " " + r.status);
        return r.text();
      });
    }
    function fallback() {
      var t = "?t=" + Date.now();
      css.forEach(function (u) { var l = document.createElement("link"); l.rel = "stylesheet"; l.href = u + t; document.head.appendChild(l); });
      (function next(i) {
        if (i >= js.length) return;
        var s = document.createElement("script"); s.src = js[i] + t; s.onload = function () { next(i + 1); };
        document.body.appendChild(s);
      })(0);
    }
    Promise.all([Promise.all(css.map(get)), Promise.all(js.map(get))]).then(function (res) {
      res[0].forEach(function (text) { var st = document.createElement("style"); st.textContent = text; document.head.appendChild(st); });
      res[1].forEach(function (text, i) {
        var s = document.createElement("script");
        s.textContent = text + "\n//# sourceURL=" + js[i];
        document.body.appendChild(s);
      });
    }).catch(fallback);
  })(["css/admin.css"], ["js/config.js", "js/content.js", "js/characters.js", "js/receipt.js", "js/admin.js"]);
</script>
</body>
</html>

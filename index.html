<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>퀴어 활동 캐해 · 부산퀴어행동</title>
  <meta name="description" content="나에게 맞는 퀴어 활동 유형을 찾고, 한마디와 함께 온라인 행진에 합류해요.">
  <meta name="theme-color" content="#5a52d5">
  <meta property="og:title" content="퀴어 활동 캐해">
  <meta property="og:description" content="나에게 맞는 퀴어 활동 유형 찾기 · 부산퀴어행동">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gasoek+One&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%B3%EF%B8%8F%E2%80%8D%F0%9F%8C%88%3C/text%3E%3C/svg%3E">
  <style>body{margin:0;background:#5874e6}</style>
</head>
<body>
  <div class="road" aria-hidden="true"></div>
  <div class="app" id="app"><p class="loading">불러오는 중…</p></div>
  <noscript><p style="color:#fff;text-align:center">이 테스트는 자바스크립트가 필요해요.</p></noscript>
  <script>
  /*
   * 캐시 우회 로더
   * 클라우드플레어가 JS/CSS를 브라우저에 4시간 캐시하기 때문에,
   * script/link 태그 대신 매번 서버에 "바뀌었나?"를 확인(대부분 304, 몇 바이트)하고 받아 실행합니다.
   * → 업데이트를 올리면 다음 접속부터 바로 반영 (강력 새로고침 불필요)
   * 새 JS/CSS 파일을 추가하면 아래 목록에도 넣어 주세요.
   */
  (function (css, js) {
    function get(u) {
      return fetch(u, { cache: "no-cache" }).then(function (r) {
        if (!r.ok) throw new Error(u + " " + r.status);
        return r.text();
      });
    }
    function fallback() {
      var t = "?t=" + Date.now();
      css.forEach(function (u) { var l = document.createElement("link"); l.rel = "stylesheet"; l.href = u + t; document.head.appendChild(l); });
      (function next(i) {
        if (i >= js.length) return;
        var s = document.createElement("script"); s.src = js[i] + t; s.onload = function () { next(i + 1); };
        document.body.appendChild(s);
      })(0);
    }
    Promise.all([Promise.all(css.map(get)), Promise.all(js.map(get))]).then(function (res) {
      res[0].forEach(function (text) { var st = document.createElement("style"); st.textContent = text; document.head.appendChild(st); });
      res[1].forEach(function (text, i) {
        var s = document.createElement("script");
        s.textContent = text + "\n//# sourceURL=" + js[i];
        document.body.appendChild(s);
      });
    }).catch(fallback);
  })(["css/style.css"], ["js/config.js", "js/content.js", "js/characters.js", "js/api.js", "js/app.js"]);
</script>
</body>
</html>
